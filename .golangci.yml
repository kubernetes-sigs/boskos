version: "2"
linters:
  enable:
    - gocognit
    - gocyclo
    - gosec
    - misspell
    - nestif
    - prealloc
    - staticcheck
    - unparam
    - whitespace
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - staticcheck
        text: 'SA1019: fakectrlruntimeclient.NewFakeClient is deprecated:'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
